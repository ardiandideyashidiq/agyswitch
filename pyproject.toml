[project]
name = "agyswitch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rdndds", email = "rdndds@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "curl-cffi>=0.17.0",
    "loguru>=0.8.0",
    "rich>=15.0.0",
    "rich-click>=1.9.9",
]

[project.scripts]
agyswitch = "agyswitch:main"
ags = "agyswitch:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.5",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
